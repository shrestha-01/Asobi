<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asobi - Leaderboard</title>
    <link rel="stylesheet" href="leaderboard_style.css">
</head>

<body>
    <div id="header">
        <span id="logoBox">Asobi</span>
        <button id="backBtn">Back to Games</button>
    </div>
    <div id="pageRow">
        <div id="sideBar">
            <p>Leaderboard</p>
            <div class="diff">Total Leaderboard</div>
            <p>By Difficulty</p>
            <div class="diff">Beginner (1 - 10)</div>
            <div class="diff">Normal (1 - 100)</div>
            <div class="diff">Hard (1 - 1K)</div>
            <div class="diff">Expert (1 - 10k)</div>
            <div class="diff">Master (1 - 100K)</div>
            <div class="diff">Impossible (1 - 1M)</div>
        </div>
        <div id="leaderTabel">
            <div class="tRow">
                <span class="pRank">Rank</span>
                <span class="pName">Player</span>
                <span class="totalBox">Total Score</span>
                <span class="pTime">Games Played</span>
            </div>
        </div>
    </div>

    <script src="leaderboard_script.js"></script>
</body>

</html>
