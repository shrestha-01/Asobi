<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asobi - Username</title>
    <link rel="stylesheet" href="username_style.css">
    <link rel="icon" type="image/png" href="Icons/asobi-logo.png">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HD2JT6YXET"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-HD2JT6YXET');
    </script>
</head>

<body>
    <div class="shapeX"></div>
    <div class="shapeX2"></div>
    <div class="shape shapeO"></div>
    <div class="shape shapeO2"></div>
    <div class="shape shapeSquare"></div>
    <div class="shape shapetri"></div>
    <div class="box-1">
        <div class="box-2"></div>
        <div class="box-3">
            <div class="title">
                <img class="controller" src="Icons/controller.svg" alt="controller">
                <h2>ASOBI</h2>
            </div>
            <h1 class="guide">Enter a
                <span class="unique">Unique Username</span>
            </h1>
            <input type="text" id="asobiuser" placeholder="Enter a unique username" maxlength="20">
            <div class="passwordWrap">
                <input type="password" id="nPasscode" placeholder="Enter a passcode">
                <img id="supereye" src="Icons/eye-close.svg" alt="show passcode">
            </div>
            <div class="passwordWrap">
                <input type="password" id="repasscode" placeholder="Retype your passcode">
                <img id="resupereye" src="Icons/eye-close.svg" alt="show passcode">
            </div>
            <p id="msgBox"></p>
            <button id="submit">Submit</button>
            <p id="noacc">No account yet ? Sign up</p>
        </div>
    </div>
    <script src="username_script.js"></script>
</body>

</html>
