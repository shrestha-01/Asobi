<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
    <link rel="stylesheet" href="guessgame_style.css">
</head>

<body>
    <!-- this box will hold the whole game -->
    <div id="gameBox">
        <h1>Guess The Number</h1>

        <div id="gameModeBox">
            <p id="gameModeTitle">Game Modes</p>

            <div id="difficultyBox">
                <p id="bestScoreBox">Best: -</p>
                <div id="difficultySelect">
                    <span id="selectTitle" class="optionTitle">Beginner</span>
                    <span id="selectValue" class="optionValue">(1 - 10)</span>
                </div>
                <div id="beginner" class="optionItem">
                    <span id="beginnerTitle" class="optionTitle">Beginner</span>
                    <span id="beginnerValue" class="optionValue">(1 - 10)</span>
                </div>
                <div id="easy" class="optionItem">
                    <span id="easyTitle" class="optionTitle">Easy</span>
                    <span id="easyValue" class="optionValue">(1 - 50)</span>
                </div>
                <div id="normal" class="optionItem">
                    <span id="normalTitle" class="optionTitle">Normal</span>
                    <span id="normalValue" class="optionValue">(1 - 100)</span>
                </div>
                <div id="medium" class="optionItem">
                    <span id="mediumTitle" class="optionTitle">Medium</span>
                    <span id="mediumValue" class="optionValue">(1 - 500)</span>
                </div>
                <div id="hard" class="optionItem">
                    <span id="hardTitle" class="optionTitle">Hard</span>
                    <span id="hardValue" class="optionValue">(1 - 1K)</span>
                </div>
                <div id="expert" class="optionItem">
                    <span id="expertTitle" class="optionTitle">Expert</span>
                    <span id="expertValue" class="optionValue">(1 - 10K)</span>
                </div>
                <div id="master" class="optionItem">
                    <span id="masterTitle" class="optionTitle">Master</span>
                    <span id="masterValue" class="optionValue">(1 - 100K)</span>
                </div>
                <div id="impossible" class="optionItem">
                    <span id="impossibleTitle" class="optionTitle">Impossible</span>
                    <span id="impossibleValue" class="optionValue">(1 - 1M)</span>
                </div>
            </div>
        </div>

        <input type="number" id="guessInput">
        <button id="guessBtn">Guess</button>
        <p id="msgBox"></p>
        <p id="distanceHintBox"></p>
        <p id="guessCountBox"> Guesses: 0</p>
        <button id="playAgainBtn">Play Again</button>
    </div>
    <script src="guessgame_script.js"></script>
</body>

</html>
