<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASOBI</title>
    <link rel="stylesheet" href="index_style.css">
</head>

<body>
    <main class="main">
        <div class="hero">
            <h1 class="logo">
                <span>A</span>
                <span>S</span>
                <span>O</span>
                <span>B</span>
                <span>I</span>
            </h1>
            <p class="japanese">あそび</p>
            <p class="moto">Simple yet Intresting</p>
            <!-- design by dexter-st -->
            <div class="btnWrap">
                <div class="line horizontal top"></div>
                <div class="line vertical right"></div>
                <div class="line horizontal bottom"></div>
                <div class="line vertical left"></div>
                <div class="dot top left"></div>
                <div class="dot top right"></div>
                <div class="dot bottom right"></div>
                <div class="dot bottom left"></div>

                <button id="startBtn">
                    <span class="btnText">Start Playing</span>
                    <img class="btnIcon" src="Icons/controller.svg" alt="controller">
                </button>
            </div>
        </div>
        </div>
    </main>
    <script src="index_script.js"></script>
</body>

</html>
