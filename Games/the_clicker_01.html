<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Clicker</title>
    <link rel="stylesheet" href="the_clicker_style_01.css">
</head>

<body>
    <div id="headerBox">
        <div id="logoBox">Asobi
            <div id="logoJp">あそび</div>
        </div>
        <div id="nav-box">
            <a href="../index.html" class="nav-link">
                <img src="../Icons/home.svg" alt="Home">
                <span>Home</span>
            </a>
            <a href="../gamelist.html" class="nav-link">
                <img src="../Icons/games.svg" alt="games">
                <span>Games</span>
            </a>
            <a href="#" class="nav-link">
                <img src="../Icons/leaderboard.svg" alt="Leaderboard">
                <span>Leaderboard</span>
            </a>
        </div>
        <div id="userBox">
            <div id="sUser">Player</div>
            <img id="logoutbTn" src="../Icons/logout.svg" alt="Logout">
        </div>
    </div>
    <div id="clickerCard">
        <div id="statsRow">
            <div id="timerCard" class="statCard">
                <div class="iconbox">
                    <img src="../Icons/time.svg" alt="timer">
                </div>
                <p class="statLabel">Time Left</p>
                <p id="time"></p>
            </div>
            <div id="cpscard" class="statCard">
                <div class="iconbox">
                    <img src="../Icons/lightning.svg" alt="cps">
                </div>
                <p class="statLabel">Current CPS</p>
                <p id="CPS"></p>
            </div>
            <div id="tcscard" class="statCard">
                <div class="iconbox">
                    <img src="../Icons/cursor.svg" alt="clicks" id="cursorIcon">
                </div>
                <p class="statLabel">Total Clicks</p>
                <p id="totalClks"></p>
            </div>
        </div>
        <button id="clickMe">Click Me!</button>
    </div>
    <script src="the_clicker_script_01.js"></script>
</body>

</html>
