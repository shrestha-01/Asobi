<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asobi - Games</title>
    <link rel="stylesheet" href="gamelist_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="loading">
    <div id="loaderRow">
        <div class="loader">
            <svg viewBox="0 0 80 80">
                <circle cx="40" cy="40" r="32"></circle>
            </svg>
        </div>
        <div class="loader triangle">
            <svg viewBox="0 0 86 80">
                <polygon points="43 8 79 72 7 72"></polygon>
            </svg>
        </div>
        <div class="loader">
            <svg viewBox="0 0 80 80">
                <rect x="8" y="8" width="64" height="64"></rect>
            </svg>
        </div>
    </div>
    <div id="loadingText">
        <p id="loadingwhat">Loading...</p>
        <p id="amount">0%</p>
        <p id="loadingNote">First load might take a bit longer(ᵕ—ᴗ—) this is to make sure the game runs smooth for you(ó﹏ò｡)</p>
    </div>
</div>
    <div id="headerBox">
        <div id="logoBox">Asobi
            <div id="logoJp">あそび</div>
        </div>
        <div id="nav-box">
            <a href="index.html" class="nav-link">
                <img src="Icons/home.svg" alt="Home">
                <span>Home</span>
            </a>
            <a href="gamelist.html" class="nav-link">
                <img src="Icons/games.svg" alt="games">
                <span>Games</span>
            </a>
            <!-- <a href="leaderboard.html" class="nav-link">
                <img src="Icons/leaderboard.svg" alt="Leaderboard">
                <span>Leadboard</span>
            </a> -->
        </div>
        <div id="userBox">
            <div id="sUser">Player</div>
            <img id="logoutbTn" src="Icons/logout.svg" alt="Logout">
        </div>
    </div>
    <div id="gamerow">
        <div class="gameCard">
            <img src="GameLogo/GuessTheNumberLogo.png" class="gtnlogo" alt="Guess The Number">
            <h3 class="gameName">Guess The Number</h3>
            <a href="guess.html" id="play">Play</a>
        </div>
        <div class="gameCard">
            <img src="GameLogo/The Clicker logo.png" class="gtnlogo" alt="The Clicker">
            <h3 class="gameName">The Clicker</h3>
            <span id="soon">Coming soon..</span>
        </div>
    </div>
    <script src="gamelist_script.js"></script>
</body>

</html>
